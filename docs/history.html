<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kabaka Snipers &middot; History</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="static/style.css">
</head>
<body>

    <header class="masthead">
        <div class="brand">
            <div class="brand-mark">KS</div>
            <div>
                <div class="brand-name">KABAKA SNIPERS</div>
                <div class="brand-sub">Forward Test &middot; Live, Real-Time</div>
            </div>
        </div>
        <nav class="masthead-nav">
            <a href="index.html" class="">Overview</a>
            <a href="running.html" class="">Running</a>
            <a href="history.html" class="active">History</a>
            <a href="swing.html" class="">Swing</a>
            <a href="intraday.html" class="">Intraday</a>
            <a href="scalp.html" class="">Scalp</a>
            <a href="settings.html" class="">Settings</a>
        </nav>
        <button class="menu-toggle" onclick="toggleDrawer()" aria-label="Open menu">&#9776;</button>
    </header>

    <div class="ticker">
        <span class="ticker-dot"></span>
        <span class="ticker-text">
            SWING ARMED &middot;
            INTRADAY DISARMED &middot;
            LAST SCAN 2026-08-17 22:53 UTC
        </span>
    </div>

    <div class="drawer-overlay" id="drawerOverlay" onclick="toggleDrawer()"></div>
    <div class="drawer" id="sideDrawer">
        <a href="index.html">Overview</a>
        <a href="running.html">Running</a>
        <a href="history.html">History</a>
        <a href="swing.html">Swing</a>
        <a href="intraday.html">Intraday</a>
        <a href="scalp.html">Scalp</a>
        <a href="settings.html">Settings</a>
    </div>
    <script>
        function toggleDrawer() {
            const d = document.getElementById('sideDrawer');
            const o = document.getElementById('drawerOverlay');
            d.classList.toggle('open');
            o.style.display = d.classList.contains('open') ? 'block' : 'none';
        }
    </script>

    <main class="shell">
        <div class="page-head">
            <h1>Closed Trade History &mdash; Swing</h1>
            <span class="page-head-note mono">0 closed trades</span>
        </div>

        
        <div class="panel empty-state">No trades have closed yet.</div>
        
    </main>
</body>
</html>
